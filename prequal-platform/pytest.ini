[pytest]
addopts = --tb=short --strict-markers --asyncio-mode=auto
# MID-645: run every async fixture/test on a single session-scoped event loop so
# the shared async engine's connection pool is never used from two different
# loops, and the session-scoped db_engine fixture is materialized once.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

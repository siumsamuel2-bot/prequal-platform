version: '3.8'

services:
  # FastAPI Backend - Development with hot reload
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: prequal-backend-dev
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: true
    environment:
      # Environment
      - ENVIRONMENT=development
      - PYTHONUNBUFFERED=1
      - DEBUG=${DEBUG:-true}
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}

      # Database - use DATABASE_URL if set, otherwise individual vars from env
      - DATABASE_URL=${DATABASE_URL:-}

      # Application settings
      - APP_NAME=Prequal Platform
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}

      # CORS - allow all in development
      - ALLOWED_ORIGINS=["http://localhost:5173","http://localhost:3000"]

      # Rate limiting (relaxed for dev)
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-1000}

      # OSHA API (optional)
      - OSHA_API_KEY=${OSHA_API_KEY:-}

      # SMTP (optional for dev)
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - EMAIL_FROM=${EMAIL_FROM:-dev@example.com}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Hot reload - mount source code
      - ./app:/app/app
      - ./api:/app/api
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    networks:
      - prequal-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # React Frontend - Development with Vite hot reload
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: builder
    container_name: prequal-frontend-dev
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:8000
      - VITE_APP_NAME=Prequal Platform
    depends_on:
      - backend
    volumes:
      # Hot reload - mount source code
      - .:/app
      - /app/node_modules
    networks:
      - prequal-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5173"]
      interval: 30s
      timeout: 5s
      retries: 3

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: prequal-db-dev
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - prequal-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d prequal"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    container_name: prequal-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - prequal-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Analytics Service - Event ingestion/reporting microservice (MID-588)
  # DevOps support: MID-591 - independent service with dedicated database
  analytics:
    build:
      context: ../analytics-service
      dockerfile: Dockerfile
    container_name: prequal-analytics-dev
    restart: unless-stopped
    ports:
      - "8006:8006"
    environment:
      - ENVIRONMENT=development
      - PYTHONUNBUFFERED=1
      - POSTGRES_SERVER=analytics-db
      - POSTGRES_USER=analytics
      - POSTGRES_PASSWORD=analytics
      - POSTGRES_DB=analytics_service
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SERVICE_API_KEY=${SERVICE_API_KEY:-dev-service-key}
      - ORG_SERVICE_URL=http://backend:8000
    depends_on:
      analytics-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - prequal-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8006/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Analytics ingestion worker - drains the Redis stream into the analytics DB (MID-588)
  analytics-worker:
    build:
      context: ../analytics-service
      dockerfile: Dockerfile
    container_name: prequal-analytics-worker
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment:
      - ENVIRONMENT=development
      - PYTHONUNBUFFERED=1
      - POSTGRES_SERVER=analytics-db
      - POSTGRES_USER=analytics
      - POSTGRES_PASSWORD=analytics
      - POSTGRES_DB=analytics_service
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      analytics-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - prequal-network

  # Dedicated analytics database - database-per-service isolation (MID-591)
  analytics-db:
    image: postgres:15-alpine
    container_name: prequal-analytics-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics
      POSTGRES_DB: analytics_service
    ports:
      - "5433:5432"
    volumes:
      - analytics_postgres_data:/var/lib/postgresql/data
      - ../analytics-service/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks:
      - prequal-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics -d analytics_service"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  prequal-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  analytics_postgres_data:
    driver: local

version: '3.8'

services:
  # FastAPI Backend - Development with hot reload
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: prequal-backend-dev
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Environment
      - ENVIRONMENT=development
      - PYTHONUNBUFFERED=1
      - DEBUG=true
      - LOG_LEVEL=DEBUG

      # Database
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/prequal

      # Redis
      - REDIS_URL=redis://redis:6379/0

      # Application settings
      - APP_NAME=Prequal Platform
      - SECRET_KEY=dev-secret-key-change-in-production
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30

      # CORS - allow all in development
      - ALLOWED_ORIGINS=["http://localhost:5173","http://localhost:3000"]

      # Rate limiting (relaxed for dev)
      - RATE_LIMIT_PER_MINUTE=1000

      # OSHA API (optional)
      - OSHA_API_KEY=${OSHA_API_KEY:-}

      # SMTP (optional for dev)
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - EMAIL_FROM=${EMAIL_FROM:-dev@example.com}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Hot reload - mount source code
      - ./app:/app/app
      - ./api:/app/api
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    networks:
      - prequal-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # React Frontend - Development with Vite hot reload
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: builder
    container_name: prequal-frontend-dev
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:8000
      - VITE_APP_NAME=Prequal Platform
    depends_on:
      - backend
    volumes:
      # Hot reload - mount source code
      - .:/app
      - /app/node_modules
    networks:
      - prequal-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5173"]
      interval: 30s
      timeout: 5s
      retries: 3

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: prequal-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: prequal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - prequal-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d prequal"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    container_name: prequal-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - prequal-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  prequal-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

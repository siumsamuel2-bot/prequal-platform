version: '3.8'

services:
# FastAPI Backend - Production
backend:
  build:
    context: .
    dockerfile: Dockerfile.backend
    target: production
  container_name: prequal-backend-prod
  restart: always
  deploy:
    resources:
      limits:
        cpus: '2.0'
        memory: 2G
      reservations:
        cpus: '0.5'
        memory: 512M
  ports:
    - "8000:8000"
  environment:
    # Environment
    - ENVIRONMENT=production
    - PYTHONUNBUFFERED=1

    # Database (from secrets)
    - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/prequal_prod

    # Redis
    - REDIS_URL=redis://redis:6379/0

    # Application settings
    - APP_NAME=Prequal Platform
    - DEBUG=false
    - LOG_LEVEL=WARNING

    # Security (from secrets)
    - SECRET_KEY=${SECRET_KEY}
    - ALGORITHM=HS256
    - ACCESS_TOKEN_EXPIRE_MINUTES=30

    # CORS - restrict to production domain
    - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}

    # Rate limiting
    - RATE_LIMIT_PER_MINUTE=60

    # OSHA API
    - OSHA_API_KEY=${OSHA_API_KEY}

    # SMTP
    - SMTP_HOST=${SMTP_HOST}
    - SMTP_PORT=${SMTP_PORT:-587}
    - SMTP_USER=${SMTP_USER}
    - SMTP_PASSWORD=${SMTP_PASSWORD}
    - EMAIL_FROM=${EMAIL_FROM}
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    - ./uploads:/app/uploads
    - ./logs:/app/logs
  networks:
    - prequal-network
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 40s
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

# React Frontend - Production
frontend:
  build:
    context: .
    dockerfile: Dockerfile.frontend
    target: production
  container_name: prequal-frontend-prod
  restart: always
  deploy:
    resources:
      limits:
        cpus: '1.0'
        memory: 512M
      reservations:
        cpus: '0.25'
        memory: 128M
  ports:
    - "80:80"
    - "443:443"
  environment:
    - NODE_ENV=production
    - VITE_API_URL=/api
    - VITE_APP_NAME=Prequal Platform
  depends_on:
    - backend
  networks:
    - prequal-network
  healthcheck:
    test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
    interval: 30s
    timeout: 5s
    retries: 3
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

# PostgreSQL Database - Production
db:
  image: postgres:15-alpine
  container_name: prequal-db-prod
  restart: always
  deploy:
    resources:
      limits:
        cpus: '2.0'
        memory: 4G
      reservations:
        cpus: '0.5'
        memory: 1G
  environment:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    POSTGRES_DB: prequal_prod
  volumes:
    - postgres_data:/var/lib/postgresql/data
    - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    - ./database/backups:/backups:ro
  networks:
    - prequal-network
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres -d prequal_prod"]
    interval: 10s
    timeout: 5s
    retries: 5
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

# Redis for caching and sessions - Production
redis:
  image: redis:7-alpine
  container_name: prequal-redis-prod
  restart: always
  command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
  deploy:
    resources:
      limits:
        cpus: '0.5'
        memory: 512M
      reservations:
        cpus: '0.1'
        memory: 64M
  volumes:
    - redis_data:/data
  networks:
    - prequal-network
  healthcheck:
    test: ["CMD", "redis-cli", "ping"]
    interval: 10s
    timeout: 5s
    retries: 5
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

networks:
  prequal-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

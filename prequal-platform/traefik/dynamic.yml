# Traefik Dynamic Configuration
# This file is referenced by traefik.yml

http:
  routers:
    backend-router:
      rule: "Host(`prequal.yourcompany.com`) && PathPrefix(`/api`)"
      service: backend-service
      entryPoints:
        - websecure
      priority: 100

    analytics-internal-router:
      # Internal/direct service traffic only (service-key authenticated).
      # External analytics traffic flows through backend-router, which
      # validates user sessions and delegates with service auth (MID-588).
      rule: "Host(`analytics.internal`) && PathPrefix(`/api`)"
      service: analytics-service
      entryPoints:
        - websecure

    frontend-router:
      rule: "Host(`prequal.yourcompany.com`)"
      service: frontend-service
      entryPoints:
        - websecure

  services:
    backend-service:
      loadBalancer:
        servers:
          - url: "http://backend:8000"

    analytics-service:
      loadBalancer:
        servers:
          - url: "http://analytics-service:8006"

    frontend-service:
      loadBalancer:
        servers:
          - url: "http://frontend:80"

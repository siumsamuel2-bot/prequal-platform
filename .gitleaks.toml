# Gitleaks Configuration for Prequal Platform
# Blocks commits containing secrets, API keys, and sensitive data

[allowlist]
description = "Global allowlist"
paths = [
  '''node_modules/''',
  '''.git/''',
  '''vendor/''',
  '''third_party/''',
  '''test.*''',
  '''test_.*''',
  '''.*_test\.''',
]
regexes = [
  '''EXAMPLE_.*''',
  '''DEV_.*''',
  '''TEST_.*''',
  '''fake-.*''',
  '''placeholder''',
]

# AWS Keys
[[rules]]
id = "aws-access-key"
description = "AWS Access Key"
regex = '''(A3T[A-Z0-9]|AKIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16}'''
tags = ["aws", "cloud"]

[[rules]]
id = "aws-secret-key"
description = "AWS Secret Key"
regex = '''(?i)aws(.{0,20})?(?-i)['\"][0-9a-zA-Z\/+]{40}['\"]'''
tags = ["aws", "cloud"]

# Stripe Keys
[[rules]]
id = "stripe-secret-key"
description = "Stripe Secret Key"
regex = '''(?i)(sk_live_|sk_test_)[0-9a-zA-Z]{24,}'''
tags = ["stripe", "payments"]

[[rules]]
id = "stripe-publishable-key"
description = "Stripe Publishable Key"
regex = '''(?i)(pk_live_|pk_test_)[0-9a-zA-Z]{24,}'''
tags = ["stripe", "payments"]

# Generic API Keys
[[rules]]
id = "generic-api-key"
description = "Generic API Key"
regex = '''(?i)(api[_-]?key|apikey|api_secret)['\s:=]+['\"][0-9a-zA-Z]{16,40}['\"]'''
tags = ["api", "generic"]

# Private Keys
[[rules]]
id = "private-key"
description = "Private Key"
regex = '''-----BEGIN (RSA|EC|OPENSSH|DSA|ENCRYPTED) PRIVATE KEY-----'''
tags = ["crypto", "key"]

# Database URLs
[[rules]]
id = "database-url"
description = "Database Connection String with Password"
regex = '''(?i)(postgres|mysql|mongodb|redis)://[^:]+:[^@]+@'''
tags = ["database", "credential"]

# JWT Secrets
[[rules]]
id = "jwt-secret"
description = "JWT Secret"
regex = '''(?i)(jwt[_-]?secret|jwt[_-]?key)['\s:=]+['\"][0-9a-zA-Z]{16,}['\"]'''
tags = ["jwt", "auth"]

# Passwords in Config
[[rules]]
id = "password-in-config"
description = "Password in Configuration"
regex = '''(?i)(password|passwd|pwd)['\s:=]+['\"][^'\"]{8,}['\"]'''
tags = ["credential", "password"]

# SendGrid API Key
[[rules]]
id = "sendgrid-api-key"
description = "SendGrid API Key"
regex = '''SG\.[0-9a-zA-Z_-]{22}\.[0-9a-zA-Z_-]{43}'''
tags = ["sendgrid", "email"]

# Twilio API Key
[[rules]]
id = "twilio-api-key"
description = "Twilio API Key"
regex = '''SK[0-9a-fA-F]{32}'''
tags = ["twilio", "sms"]

# GitHub Token
[[rules]]
id = "github-token"
description = "GitHub Personal Access Token"
regex = '''ghp_[0-9a-zA-Z]{36}'''
tags = ["github", "token"]

# Slack Token
[[rules]]
id = "slack-token"
description = "Slack Token"
regex = '''xox[baprs]-[0-9a-zA-Z]{10,48}'''
tags = ["slack", "messaging"]
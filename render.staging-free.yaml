# Render FREE-tier staging blueprint for Prequal (MID-625)
#
# Board decision (MID-71): no AWS, no paid services. This blueprint deploys the
# FastAPI backend on a Render FREE web service. Postgres is Neon free tier —
# its connection string is supplied as a Render sync secret (DATABASE_URL),
# NOT as a Render database (paid). Frontend lives on Vercel free (see
# prequal-platform/vercel.json). Redis is omitted: rate limiting falls back to
# in-memory storage, acceptable for staging/pilot validation.
#
# Apply via Render dashboard: New + -> Blueprint -> connect repo -> accept
# the default render.yaml path (the repo-root render.yaml IS this staging-free
# blueprint). This copy is kept for "Apply from file".

services:
  - type: web
    name: prequal-staging-api
    # Deploy branch: MUST track `develop` (same branch the CI `deploy-staging`
    # job targets). Render defaults to the repo default branch (master/main)
    # when `branch` is omitted - that default was ~5 months stale and caused
    # the migration-016 deploy failures (MID-675). master/main are NOT the
    # deploy branch.
    branch: develop
    env: python
    plan: free
    rootDir: prequal-platform
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: DEBUG
        value: false
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        # Keep identical to the root render.yaml (MID-680). GitHub Pages
        # origin added for the board-independent SPA deploy (MID-695).
        value: http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,https://prequal-platform.vercel.app,https://prequal-staging.vercel.app,https://siumsamuel2-bot.github.io
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"
    healthCheckPath: /health
    autoDeploy: true

  # Frontend fallback host (MID-685): insurance for the pilot while the
  # board's Vercel import keeps 404ing (MID-71). Same Vite build as the
  # Vercel path (which stays primary and untouched). Render rewrites with
  # absolute destinations are server-side proxied, so the SPA keeps calling
  # same-origin /api (its default, prequal-platform/src/api/client.ts) with
  # NO VITE_API_URL build env and NO CORS changes. Plan B if the proxy ever
  # misbehaves: set build env VITE_API_URL=https://prequal-staging-api.onrender.com/api
  # and append this site's origin to ALLOWED_ORIGINS above, then redeploy.
  - type: static
    name: prequal-staging-frontend
    branch: develop
    rootDir: prequal-platform
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "18"
    routes:
      # Order matters: /api/* must match before the catch-all SPA fallback.
      - type: rewrite
        source: /api/*
        destination: https://prequal-staging-api.onrender.com/api/*
      # SPA client-side routing fallback: any non-file path -> index.html.
      - type: rewrite
        source: /*
        destination: /index.html

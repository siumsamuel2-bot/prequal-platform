name: Dependency Security

# MID-595: automated dependency vulnerability scanning + SBOM.
# Blocks on Critical/High vulnerabilities in *production* dependencies and on
# any Python advisory. Dev-only Node findings are reported but non-blocking.
# Complements ci-cd.yml (which runs advisory-only legacy checks).

on:
  push:
    branches: [ main, develop, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop, master ]
  schedule:
    # Weekly re-scan to catch newly published advisories.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'

jobs:
  python-dependency-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - prequal-platform
          - identity-service
          - analytics-service
          - codedeploy-hooks
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit ${{ matrix.service }}
        run: |
          REQ="${{ matrix.service }}/requirements.txt"
          if [ ! -f "$REQ" ]; then
            echo "No $REQ found; skipping."
            exit 0
          fi
          # pip-audit exits non-zero when advisories are present.
          # Documented, accepted-risk ignores go in .pip-audit-ignore (one ID per line).
          IGNORE_ARGS=""
          if [ -f .pip-audit-ignore ]; then
            while read -r id; do
              [ -n "$id" ] && IGNORE_ARGS="$IGNORE_ARGS --ignore-vuln $id"
            done < .pip-audit-ignore
          fi
          pip-audit -r "$REQ" \
            --desc on \
            --progress-spinner off \
            $IGNORE_ARGS

  node-dependency-audit:
    name: Node dependency audit (production)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prequal-platform
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: prequal-platform/package-lock.json

      # npm is the authority for this workspace (package-lock.json is kept in
      # sync with package.json). The previous corepack/pnpm path auto-resolved
      # an incompatible pnpm (12.9.1) on Node 18 and failed to execute before
      # installing anything.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit production dependencies (fail on High/Critical)
        run: npm audit --omit=dev --audit-level=high

      - name: Full audit (advisory, non-blocking)
        if: always()
        run: npm audit || true

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@v4

      - name: Generate CycloneDX SBOM for repository
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          artifact-name: sbom-repository.cyclonedx.json
          output-file: sbom-repository.cyclonedx.json

      - name: Generate CycloneDX SBOM for Python backend
        uses: anchore/sbom-action@v0
        with:
          path: prequal-platform
          format: cyclonedx-json
          artifact-name: sbom-prequal-platform.cyclonedx.json
          output-file: sbom-prequal-platform.cyclonedx.json

      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: '*.cyclonedx.json'
          retention-days: 90
